[package]
name = "secret-rotator"
version = "0.6.2"
edition = "2021"
rust-version = "1.75"
authors = ["Kelley Blackmore"]
description = "Automatic secret rotation tool with HashiCorp Vault, AWS, Azure, GCP, and Kubernetes support"
license = "MIT"

[[bin]]
name = "asr"
path = "src/main.rs"

[features]
default = []
# Enable Azure Key Vault backend
azure = []
# Enable GCP Secret Manager backend
gcp = []
# Enable OpenShift/Kubernetes backend
ocp = ["dep:kube", "dep:k8s-openapi"]
# Enable MySQL/MariaDB target
mysql = ["dep:mysql_async"]
# Enable macOS Keychain support
keychain = ["dep:keyring"]
# Enable GitLab CI/CD variable target
gitlab = []
# Enable GitHub Actions secret/variable target (requires NaCl sealed-box encryption)
github = ["dep:crypto_box", "dep:blake2"]
# Enable integration tests (requires running Vault + PostgreSQL via docker-compose)
integration = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
# NOTE: the AWS SDK crates' default feature set includes the legacy `rustls`
# feature, which drags in rustls 0.21 / rustls-webpki 0.101 (RUSTSEC-2026-0098,
# -0099, -0104). `default-https-client` is the modern path (rustls 0.23 via
# aws-lc), so opt out of defaults and re-enable only what we use.
aws-sdk-secretsmanager = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
] }
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-sdk-sts = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sigv4a",
    "behavior-version-latest",
] }
aws-credential-types = "1"
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1"
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"

# Optional: Kubernetes / OpenShift backend
kube = { version = "4", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.28", features = ["v1_34"], optional = true }

# Optional: MySQL/MariaDB target
mysql_async = { version = "0.37", optional = true, features = ["native-tls"] }

# Optional: system keychain (macOS Keychain, Windows Credential Store, Linux Secret Service)
keyring = { version = "4", optional = true }

# Optional: NaCl sealed-box encryption for GitHub Actions secrets
crypto_box = { version = "0.9", features = ["seal"], optional = true }
# Optional: Blake2b nonce derivation for GitHub sealed-box (libsodium-compatible)
blake2 = { version = "0.10", optional = true }

# Vendored OpenSSL for Linux ARM64 cross-compilation (cross Docker image lacks system headers)
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
