[package]
name = "secret-rotator"
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
authors = ["Kelley Blackmore"]
description = "Automatic secret rotation tool with HashiCorp Vault, AWS, Azure, GCP, and Kubernetes support"
license = "MIT"

[[bin]]
name = "asr"
path = "src/main.rs"

[features]
default = []
# Enable Azure Key Vault backend
azure = []
# Enable GCP Secret Manager backend
gcp = []
# Enable OpenShift/Kubernetes backend
ocp = ["dep:kube", "dep:k8s-openapi"]
# Enable MySQL/MariaDB target
mysql = ["dep:mysql_async"]
# Enable macOS Keychain support
keychain = ["dep:keyring"]
# Enable integration tests (requires running Vault + PostgreSQL via docker-compose)
integration = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
aws-sdk-secretsmanager = "1"
aws-config = "1"
aws-sdk-sts = "1"
async-trait = "0.1"
tokio-postgres = "0.7"

# Optional: Kubernetes / OpenShift backend
kube = { version = "0.98", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_31"], optional = true }

# Optional: MySQL/MariaDB target
mysql_async = { version = "0.34", optional = true, default-features = false, features = ["minimal"] }

# Optional: system keychain (macOS Keychain, Windows Credential Store, Linux Secret Service)
keyring = { version = "3", optional = true }

[dev-dependencies]
mockito = "1"
tempfile = "3"
