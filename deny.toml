# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Run locally with:
#   cargo install cargo-deny --locked
#   cargo deny --all-features check advisories bans licenses sources

[graph]
all-features = true

[advisories]
# Vulnerabilities are a hard failure; `cargo audit` in the same workflow is the
# primary gate. The tree is currently clean — 0 vulnerabilities and 0
# warnings — so there is nothing to ignore. Add entries here only with the
# reason recorded alongside.
yanked = "deny"
ignore = []

[licenses]
# Every licence observed in the current tree. Adding a dependency under a
# licence not on this list is a deliberate decision, so make CI ask for it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's CA root certificate bundle, via webpki-root-certs ->
    # rustls-platform-verifier -> kube-client. A permissive data licence.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are common and mostly harmless in a Rust tree; warn so
# they show up in the log without turning CI red.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
