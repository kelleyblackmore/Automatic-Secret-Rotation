# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Run locally with:
#   cargo install cargo-deny --locked
#   cargo deny --all-features check advisories bans licenses sources

[graph]
all-features = true

[advisories]
# Vulnerabilities are a hard failure; `cargo audit` in the same workflow is the
# primary gate. The tree has 0 vulnerabilities; the only entries below are
# informational advisories with no upgrade path. Add entries here only with
# the reason recorded alongside.
yanked = "deny"
ignore = [
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6 and are
    # flagged unmaintained, with no patched version. They are only reachable
    # through the optional `keychain` feature (keyring -> secret-service ->
    # zbus 5), and secret-service has no zbus 6 release yet. Drop these once
    # keyring's Linux store moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; merged into zbus 6, awaiting secret-service upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; merged into zbus 6, awaiting secret-service upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; merged into zbus 6, awaiting secret-service upgrade" },
]

[licenses]
# Every licence observed in the current tree. Adding a dependency under a
# licence not on this list is a deliberate decision, so make CI ask for it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's CA root certificate bundle, via webpki-root-certs ->
    # rustls-platform-verifier -> kube-client. A permissive data licence.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are common and mostly harmless in a Rust tree; warn so
# they show up in the log without turning CI red.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
