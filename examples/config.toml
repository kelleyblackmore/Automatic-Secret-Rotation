# Example Configuration for Secret Rotator

[vault]
# Vault server address
address = "http://127.0.0.1:8200"

# Vault token with permissions to read/write secrets and metadata
# In production, use environment variables or secure secret management
# For local development with 'make vault-docker', use: "root"
token = "root"

# KV v2 mount point in Vault
mount = "secret"

# Optional: File backend for local storage (useful for testing)
# [file]
# directory = "~/.asr/secrets"

[rotation]
# Default rotation period in months
period_months = 6

# Length of generated secrets (characters)
secret_length = 32

# Optional: Database configuration for PostgreSQL password rotation
# [database]
# host = "localhost"
# port = 5432
# database = "postgres"
# username = "postgres"
# # Path in secret backend for admin password (recommended)
# password_path = "admin/postgres-password"
# # Or provide password directly (not recommended for production)
# # password = "your-admin-password"
# # SSL mode: disable (plaintext), require (TLS, certificate not verified),
# # or prefer / allow / verify-ca / verify-full (TLS required, certificate verified).
# # There is no plaintext fallback: only "disable" connects without TLS.
# ssl_mode = "prefer"
