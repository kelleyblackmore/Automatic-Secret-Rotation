# .github/dependabot.yml – keeps pinned action SHAs, base images, and
# dependencies on their latest releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: pip   # or npm, terraform, ...
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
