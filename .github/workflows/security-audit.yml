name: Security Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  # Advisories are published against dependency versions we already pin, so a
  # push-triggered audit alone can go stale. Re-run weekly against an unchanged
  # Cargo.lock to catch those.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Fails on vulnerabilities. Unmaintained/unsound *warnings* are triaged in
      # deny.toml by the `cargo deny` job below rather than blocking here.
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
