name: Tag Release

# Releasing is "merge a version bump to main": when Cargo.toml's version has
# no v<version> tag yet, this tags the pushed commit and starts release.yml.
#
# A tag created with GITHUB_TOKEN does not trigger other workflows, so
# release.yml is started with workflow_dispatch (the documented exception)
# at the new tag. github.ref is then refs/tags/v<version>, and release.yml
# runs exactly as it does for a hand-pushed tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes to main must not both try to create the same tag.
concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag new version and start the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag
      actions: write # dispatch release.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Cargo.toml version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Created through the API rather than git push, so no git credentials
      # are ever written to disk in this job.
      - name: Create annotated tag
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$GITHUB_SHA" -f type=commit \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$tag_sha" --silent
          echo "Tagged $GITHUB_SHA as $TAG"

      - name: Start the release workflow
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
