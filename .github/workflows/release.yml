name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default; each job that writes asks for exactly what it needs.
# The build matrix compiles third-party code and must not hold a write token.
permissions:
  contents: read

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: asr-linux-x86_64
            strip: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: asr-linux-arm64
            strip: true
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: asr-darwin-x86_64
            strip: true

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: asr-darwin-arm64
            strip: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: asr-windows-x86_64.exe
            strip: false
            use_cmake: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross tool (Linux ARM64)
        if: matrix.use_cross == true
        # Pinned: an unpinned git install builds whatever cross-rs/cross main is
        # at release time into our ARM64 binary. Bump deliberately.
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 5f05d13dc37c0db79f4448642c68e108b977a9e1

      # No build cache here: release binaries are built from a clean slate so a
      # cache written by an earlier (less trusted) run can't end up in them.

      - name: Build release binary (standard)
        if: matrix.use_cross != true && matrix.use_cmake != true
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Build release binary (Windows — CFLAGS and CMake to satisfy aws-lc-sys C11 requirement)
        if: matrix.use_cmake == true
        env:
          CFLAGS: /std:c11
          AWS_LC_SYS_CMAKE_BUILDER: "1"
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Build release binary (Linux ARM64 — cross handles sysroot and OpenSSL)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Strip binary (Unix)
        if: matrix.strip == true && runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/asr || true

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/asr ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/asr.exe" "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 7
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asr-*
          merge-multiple: true
          path: release-assets

      # v0.6.1 published with zero assets. Guard the other way round too: never
      # create a release unless every binary actually arrived.
      - name: Verify all release assets are present
        run: |
          ls -lh release-assets/
          expected="
            asr-linux-x86_64
            asr-linux-arm64
            asr-darwin-x86_64
            asr-darwin-arm64
            asr-windows-x86_64.exe
          "
          missing=0
          for asset in $expected; do
            if [ ! -s "release-assets/$asset" ]; then
              echo "::error::Missing or empty release asset: $asset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to create a release with incomplete assets"
            exit 1
          fi
          echo "All 5 binaries present."

      # Installers verify downloads against this file before installing.
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum asr-* > SHA256SUMS && cat SHA256SUMS

      # SLSA build provenance for the binaries, so a download can be traced back
      # to this workflow run:
      #   gh attestation verify <binary> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/asr-linux-x86_64
            release-assets/asr-linux-arm64
            release-assets/asr-darwin-x86_64
            release-assets/asr-darwin-arm64
            release-assets/asr-windows-x86_64.exe

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          body: |
            ## Release ${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|-------------|---------|
            | Linux | x86_64 | [asr-linux-x86_64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/asr-linux-x86_64) |
            | Linux | ARM64 | [asr-linux-arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/asr-linux-arm64) |
            | macOS | x86_64 | [asr-darwin-x86_64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/asr-darwin-x86_64) |
            | macOS | ARM64 (Apple Silicon) | [asr-darwin-arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/asr-darwin-arm64) |
            | Windows | x86_64 | [asr-windows-x86_64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/asr-windows-x86_64.exe) |

            ### Quick Install

            **Linux / macOS:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            Installers check each download against `SHA256SUMS`. To verify a
            binary was built by this workflow:
            ```bash
            gh attestation verify asr-linux-x86_64 --repo ${{ github.repository }}
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

          files: |
            release-assets/asr-linux-x86_64
            release-assets/asr-linux-arm64
            release-assets/asr-darwin-x86_64
            release-assets/asr-darwin-arm64
            release-assets/asr-windows-x86_64.exe
            release-assets/SHA256SUMS
            install.sh
            install.ps1

  sbom:
    name: Generate SBOM
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release binaries for attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asr-*
          merge-multiple: true
          path: release-assets

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: asr-${{ github.ref_name }}.spdx.json
          artifact-name: asr-sbom-spdx
          upload-artifact: true
          # Uploaded explicitly below: sbom-action only attaches release assets
          # on push/release events, not when Tag Release dispatches this run.
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: asr-${{ github.ref_name }}.cdx.json
          artifact-name: asr-sbom-cdx
          upload-artifact: true
          # Uploaded explicitly below: sbom-action only attaches release assets
          # on push/release events, not when Tag Release dispatches this run.
          upload-release-assets: false

      # actions/attest-sbom is deprecated (#51); actions/attest with sbom-path
      # is its replacement and produces the same SPDX predicate:
      #   gh attestation verify <binary> --repo <owner>/<repo> \
      #     --predicate-type https://spdx.dev/Document/v2.3
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/asr-linux-x86_64
            release-assets/asr-linux-arm64
            release-assets/asr-darwin-x86_64
            release-assets/asr-darwin-arm64
            release-assets/asr-windows-x86_64.exe
          sbom-path: asr-${{ github.ref_name }}.spdx.json

      # Attach both SBOMs to the draft. Must happen before publish: releases are
      # immutable once published.
      - name: Upload SBOMs to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "asr-$TAG.spdx.json" "asr-$TAG.cdx.json"

  # This repo has GitHub's immutable releases enabled: once a release is
  # published its asset list is frozen and every further upload 422s with
  # "Cannot upload assets to an immutable release". So the release is created as
  # a draft, every job that attaches assets runs against the draft, and only
  # then do we flip it to published.
  publish:
    name: Publish Release
    needs: [create-release, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Flip draft to published
        run: gh release edit "$TAG" --draft=false
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Install the published release the way users do, on every OS, and check
  # what they'd get: checksums (inside the installers), a runnable binary of
  # the right version, and both attestations.
  verify-release:
    name: Verify published release (${{ matrix.os }})
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with install.sh
        if: runner.os != 'Windows'
        env:
          ASR_VERSION: ${{ github.ref_name }}
          ASR_BINARY_NAME: asr
        run: |
          bash ./install.sh
          "$HOME/.local/bin/asr" --version | tee version.txt
          grep -qx "asr ${ASR_VERSION#v}" version.txt

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASR_VERSION: ${{ github.ref_name }}
        run: |
          ./install.ps1
          $out = & "$env:LOCALAPPDATA\Programs\asr\asr.exe" --version
          Write-Host $out
          if ($out -ne "asr $($env:ASR_VERSION.TrimStart('v'))") { throw "unexpected version: $out" }

      - name: Check release assets
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          missing=0
          for a in asr-linux-x86_64 asr-linux-arm64 asr-darwin-x86_64 asr-darwin-arm64 \
                   asr-windows-x86_64.exe SHA256SUMS install.sh install.ps1 \
                   "asr-$TAG.spdx.json" "asr-$TAG.cdx.json"; do
            if ! grep -qx "$a" <<< "$assets"; then
              echo "::error::Release is missing $a"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'asr-linux-x86_64' --dir verify
          gh attestation verify verify/asr-linux-x86_64 --repo "$GITHUB_REPOSITORY"
          gh attestation verify verify/asr-linux-x86_64 --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3
