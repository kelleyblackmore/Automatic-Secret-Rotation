name: Integration Tests

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  integration:
    name: Integration Tests (Vault + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      vault:
        image: hashicorp/vault:1.17
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          # Service healthchecks run via `docker exec`, which does NOT inherit
          # the env the image entrypoint sets. Without this the Vault CLI falls
          # back to its built-in https://127.0.0.1:8200 default, tries TLS
          # against a plain-HTTP dev listener, and the container never goes
          # healthy. Probe over HTTP directly so we don't depend on CLI env.
          VAULT_ADDR: http://127.0.0.1:8200
        options: >-
          --health-cmd "wget -q -O- http://127.0.0.1:8200/v1/sys/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        # vault needs IPC_LOCK but GitHub Actions services can't use cap_add
        # Use dev mode which doesn't require it

      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U admin -d testdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Dev-mode Vault already mounts KV v2 at secret/, so there is nothing to
      # enable here — and the `vault` CLI is not installed on the runner anyway.
      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health; then
              echo "Vault is ready"
              exit 0
            fi
            echo "Waiting for Vault... ($i/30)"
            sleep 2
          done
          echo "::error::Vault did not become ready within 60s"
          exit 1

      - name: Run integration tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
          VAULT_MOUNT: secret
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: admin
          PGPASSWORD: admin_password
          PGDATABASE: testdb
        run: |
          cargo test --features integration -- --ignored
