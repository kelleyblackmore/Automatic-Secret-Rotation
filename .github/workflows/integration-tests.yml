name: Integration Tests

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  integration:
    name: Integration Tests (Vault + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      vault:
        image: hashicorp/vault:1.17
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --health-cmd "vault status"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        # vault needs IPC_LOCK but GitHub Actions services can't use cap_add
        # Use dev mode which doesn't require it

      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U admin -d testdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Wait for Vault to be ready
        run: |
          until curl -sf http://127.0.0.1:8200/v1/sys/health; do
            echo "Waiting for Vault..."
            sleep 2
          done

      - name: Enable Vault KV v2
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=test-root-token
          vault secrets enable -version=2 -path=secret kv || true

      - name: Run integration tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
          VAULT_MOUNT: secret
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: admin
          PGPASSWORD: admin_password
          PGDATABASE: testdb
        run: |
          cargo test --features integration -- --ignored
